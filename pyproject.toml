[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "everpure-case-study"
version = "0.1.0"
description = "Reproducible Everpure install-base case study through Phase 3"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "duckdb>=1.4,<2",
  "matplotlib>=3.10,<4",
  "lifelines>=0.30,<0.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<1",
  "jupyterlab>=4,<5",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6,<8",
]

[project.scripts]
everpure-phase1 = "everpure_case.pipeline:main"
everpure-phase2 = "everpure_case.phase2_pipeline:main"
everpure-phase3 = "everpure_case.phase3_pipeline:main"
everpure-phase4 = "everpure_case.phase4_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
